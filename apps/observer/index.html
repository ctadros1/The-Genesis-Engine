<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeSim Observer</title>
  </head>
  <body>
    <main id="app">
      <header id="topbar">
        <h1>LifeSim Observer</h1>
        <p id="status" role="status" aria-live="polite">Disconnected</p>
      </header>
      <section id="connect-panel" aria-label="Connection">
        <label>Observer token <input id="observer-token" type="password" autocomplete="off" /></label>
        <label>Admin token (optional) <input id="admin-token" type="password" autocomplete="off" /></label>
        <button id="connect">Connect</button>
      </section>
      <section id="stage-wrap" aria-label="World view" hidden>
        <div id="viewport"></div>
        <div id="hud">
          <div id="controls" aria-label="Simulation controls">
            <button id="btn-pause" disabled title="Requires admin token">Pause</button>
            <button id="btn-resume" disabled title="Requires admin token">Resume</button>
            <label id="speed-label">Speed
              <select id="speed" disabled title="Requires admin token">
                <option value="1">1x</option>
                <option value="4">4x</option>
                <option value="16">16x</option>
              </select>
            </label>
            <button id="btn-overlay" aria-pressed="false">Scientific overlay</button>
          </div>
          <div id="charts" aria-label="Population chart">
            <canvas id="chart" width="260" height="80"></canvas>
            <p id="chart-text" class="visually-hidden" aria-live="off"></p>
          </div>
        </div>
        <aside id="inspector" aria-label="Organism inspector" hidden>
          <h2>Organism <span id="inspect-id"></span></h2>
          <button id="inspect-close" aria-label="Close inspector">Close</button>
          <dl id="inspect-body"></dl>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
